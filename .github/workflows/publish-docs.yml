name: Publish versioned core documentation

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"
    paths:
      - docs/**
      - boards.txt
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/publish-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-root-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r requirements-docs.txt
      - uses: actions/create-github-app-token@v1
        id: pages-token
        with:
          app-id: ${{ secrets.DOCS_PUBLISH_APP_ID }}
          private-key: ${{ secrets.DOCS_PUBLISH_APP_PRIVATE_KEY }}
          owner: stm32duino
          repositories: stm32duino.github.io
          permission-contents: write
      - name: Configure Pages remote
        env:
          PAGES_TOKEN: ${{ steps.pages-token.outputs.token }}
        run: git remote add pages "https://x-access-token:${PAGES_TOKEN}@github.com/stm32duino/stm32duino.github.io.git"
      - name: Publish development documentation
        if: github.ref == 'refs/heads/main'
        run: |
          if git ls-remote --exit-code --heads pages gh-pages >/dev/null; then
            mike deploy --remote pages --branch gh-pages --push dev
          else
            mike deploy --remote pages --branch gh-pages --default dev --push dev
          fi
      - name: Publish release documentation
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported documentation release tag: $VERSION" >&2
            exit 1
          fi
          latest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [[ "$VERSION" == "$latest" ]]; then
            mike deploy --remote pages --branch gh-pages --update-aliases --push "$VERSION" latest
            mike set-default --remote pages --branch gh-pages --push latest
          else
            mike deploy --remote pages --branch gh-pages --push "$VERSION"
          fi
